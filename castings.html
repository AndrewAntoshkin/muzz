<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Кастинги · Кадр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body class="app-body-root" data-page="castings" data-page-title="Кастинги" data-header="page"
  data-profession="actor"
  data-user-name="Александр Взметнев"
  data-user-city="Москва"
  data-user-avatar="assets/actors/vzmetnev-avatar.jpg"
  data-profile-complete="78"
  data-profile-views="12">

<div class="app-frame">
  <aside id="app-sidebar"></aside>

  <div class="app-main">
    <header id="app-header"></header>

    <div class="app-main__body app-main__body--catalog">
      <main class="page-area">
        <div class="page-scroll catalog-page" id="castings-catalog">

          <header class="catalog-page__head catalog-page__head--row">
            <div>
              <a href="index.html" class="catalog-page__back">← Главная</a>
              <h1 class="catalog-page__title">Кастинги и вакансии</h1>
              <p class="catalog-page__lead">Открытые роли в кино, сериалах и рекламе — отклик до дедлайна</p>
            </div>
            <a href="casting.html?new=1" class="btn-primary btn-sm catalog-page__cta">Опубликовать</a>
          </header>

          <div class="catalog-stats" aria-label="Сводка">
            <div class="catalog-stat">
              <strong data-stat="total">9</strong>
              <span>в ленте</span>
              <em data-stat-hint="castings-week">+12 за неделю</em>
            </div>
            <div class="catalog-stat">
              <strong data-stat="urgent">3</strong>
              <span>срочных</span>
              <em>до 10 июня</em>
            </div>
            <div class="catalog-stat">
              <strong data-stat="platforms">5</strong>
              <span>платформ</span>
              <em>заказчики</em>
            </div>
            <div class="catalog-stat">
              <strong data-stat="match">2</strong>
              <span>подходят вам</span>
              <em>по профилю</em>
            </div>
          </div>

          <label class="catalog-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" data-feed-search placeholder="Название роли, студия или платформа…" />
            <span class="catalog-search__count" data-feed-count>9 кастингов</span>
          </label>

          <div class="search-layout catalog-layout" data-feed-filters>
            <aside class="catalog-filters">
              <section class="search-filter">
                <div class="search-filter__title">Платформа</div>
                <div class="search-filter__chips">
                  <button type="button" class="search-chip is-on" data-filter-platform="">Все</button>
                  <button type="button" class="search-chip" data-filter-platform="kinopoisk">Кинопоиск</button>
                  <button type="button" class="search-chip" data-filter-platform="okko">Okko</button>
                  <button type="button" class="search-chip" data-filter-platform="start">START</button>
                  <button type="button" class="search-chip" data-filter-platform="kion">KION</button>
                </div>
              </section>

              <section class="search-filter">
                <div class="search-filter__title">Формат</div>
                <div class="search-filter__chips">
                  <button type="button" class="search-chip is-on" data-filter-format="">Все</button>
                  <button type="button" class="search-chip" data-filter-format="film">Полный метр</button>
                  <button type="button" class="search-chip" data-filter-format="series">Сериал</button>
                  <button type="button" class="search-chip" data-filter-format="doc">Док</button>
                  <button type="button" class="search-chip" data-filter-format="short">Короткий метр</button>
                  <button type="button" class="search-chip" data-filter-format="ad">Реклама</button>
                </div>
              </section>

              <section class="search-filter">
                <div class="search-filter__title">Дополнительно</div>
                <label class="catalog-filters__check">
                  <input type="checkbox" data-filter-urgent />
                  <span>Только срочные</span>
                </label>
              </section>

              <button type="button" class="btn-secondary btn-block catalog-filters__reset" data-feed-reset>Сбросить фильтры</button>
            </aside>

            <div class="catalog-results">
              <div id="feed-castings" class="catalog-feed-list feed-list" data-feed-list="castings" aria-live="polite"></div>
              <p id="feed-empty" class="catalog-empty" hidden>По выбранным фильтрам ничего не найдено. <button type="button" class="btn-ghost" data-feed-reset>Сбросить фильтры</button></p>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>
</div>

<script src="assets/shell.js"></script>
<script src="assets/feed.js" defer></script>
</body>
</html>
