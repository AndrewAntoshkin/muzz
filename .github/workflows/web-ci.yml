name: Web CI

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # В коде есть старые ошибки lint (react-hooks) — пока не блокируем, но видим в отчёте.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          DATABASE_URL: postgres://kadr:kadr@localhost:5432/kadr
          AUTH_SECRET: ci-only-secret-not-used-in-production
