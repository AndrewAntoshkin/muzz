<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Сообщения · Кадр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/simplesocial-tokens.css" />
<link rel="stylesheet" href="assets/theme.css" />
<link rel="stylesheet" href="assets/simplesocial-overrides.css" />
</head>
<body class="app-body-root" data-page="messages" data-page-title="Сообщения"
  data-profession="actor"
  data-user-name="Александр Взметнев"
  data-user-city="Москва"
  data-user-avatar="assets/actors/vzmetnev-avatar.jpg"
  data-profile-complete="78"
  data-profile-views="12">

<div class="app-frame">
  <aside id="app-sidebar"></aside>

  <div class="app-main">
    <header id="app-header"></header>

    <div class="app-main__body">
      <main class="page-area" style="padding:0; overflow:hidden;">
        <div class="msg-layout">

          <!-- LEFT: thread list -->
          <aside class="msg-list">
            <div class="msg-list__head">
              <div class="msg-list__title">Сообщения · 1</div>
              <label class="msg-list__search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" placeholder="Поиск по чатам" />
              </label>
            </div>

            <div class="msg-row is-active">
              <img src="assets/people/kevorkova.jpg" alt="" />
              <div>
                <div class="msg-row__name">Анна Кеворкова <span class="tag tag-green" style="font-size:10px; padding:1px 6px;">Кастинг</span></div>
                <div class="msg-row__preview">Самопробы</div>
              </div>
              <div style="text-align:right;">
                <div class="msg-row__time">11:00</div>
              </div>
            </div>
          </aside>

          <!-- RIGHT: thread -->
          <section class="msg-thread">
            <div class="msg-thread__head">
              <img src="assets/people/kevorkova.jpg" alt="" />
              <div>
                <div class="name">Анна Кеворкова</div>
                <div class="meta">Кастинг-директор · «Тихий январь»</div>
              </div>
              <div class="actions">
                <a href="profile-casting.html" class="btn-secondary btn-sm">Профиль</a>
                <a href="casting.html" class="btn-secondary btn-sm">К кастингу</a>
              </div>
            </div>

            <div class="msg-thread__body">
              <div class="msg-day">Сегодня</div>
              <div class="msg-bubble is-me">
                Самопробы
                <div class="msg-bubble__time">11:00</div>
              </div>
              <div class="msg-tape" aria-hidden="true" style="pointer-events:none; display:flex; align-items:center; gap:10px; width:220px; margin-left:auto; padding:10px 12px; border-radius:14px; background:var(--ss-surface-active);">
                <span style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ss-surface-panel);">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </span>
                <span>
                  <span style="display:block;font-size:13px;font-weight:600;">Самопроба</span>
                  <span style="font-size:11px;color:var(--text-muted);">2:14</span>
                </span>
              </div>
            </div>

            <div class="msg-thread__compose">
              <button type="button" class="btn-secondary btn-sm" title="Прикрепить">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>
              <textarea placeholder="Сообщение…"></textarea>
              <button type="button" class="btn-primary btn-sm">Отправить</button>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>
</div>

<script src="assets/roles.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/rail.js" defer></script>
</body>
</html>
