services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kadr
      POSTGRES_PASSWORD: kadr
      POSTGRES_DB: kadr
    ports:
      - "5432:5432"
    volumes:
      - kadr_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadr -d kadr"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kadr
      MINIO_ROOT_PASSWORD: kadrfiles1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kadr_minio:/data

volumes:
  kadr_pg:
  kadr_minio:
