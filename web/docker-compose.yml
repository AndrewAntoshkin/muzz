services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kadr
      POSTGRES_PASSWORD: kadr
      POSTGRES_DB: kadr
    ports:
      - "5432:5432"
    volumes:
      - kadr_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadr -d kadr"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  kadr_pg:
